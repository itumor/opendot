# The dot body slice of an agent preset (agent.cordis.yml).
#
# Mount the whole `standard` preset stack plus this group to get the full dot.
# Replace /path/to with your checkout and dot home, and place this group inside
# your own agent preset file (see your DSH presets directory).
#
# Editing a file:// plugin changes the dot on its next mount — no build step.
# Rows MUST point at the stable *.entry.js shims, never at the organ files:
# Node caches file: modules per process by URL, so each mount re-imports the
# organ through its shim (per-mount-unique query) and organs re-import lib/*
# helpers behind mtime-stamped queries — fresh code, no harness restart.
# Only an organ's name/inject list is frozen per process: changing plugin
# identity asks for a restart and fails loudly, never silently.

- id: dot
  name: cordis:group
  group: true
  isolate:
    dotCore: true
    dotMemory: true
    dotScheduler: true
    dotPolicy: true
    dotEvents: true
    dotProfile: true
    dotReport: true
  config:
    - id: dot-core
      name: 'file:///path/to/opendot/plugins/dot-core.entry.js'
      config:
        root: /path/to/dot-home   # the .dot state directory; files are the interface

    - id: dot-scheduler
      name: 'file:///path/to/opendot/plugins/dot-scheduler.entry.js'
      config:
        heartbeatSeconds: 60      # min 5, max 3600

    - id: dot-memory
      name: 'file:///path/to/opendot/plugins/dot-memory.entry.js'

    - id: dot-policy
      name: 'file:///path/to/opendot/plugins/dot-policy.entry.js'

    - id: dot-events
      name: 'file:///path/to/opendot/plugins/dot-events.entry.js'
      config:
        # inboxPath: /dot/inbox     # GET|POST trigger enqueue
        # hookPrefix: /dot/hook     # POST named webhooks
        # statusPath: /dot/status   # GET activity view (HTML or ?format=json)
        # secret: change-me         # gates write endpoints (x-dot-secret header or ?secret=)
        # ghSecret: webhook-token   # GitHub bridge: verify X-Hub-Signature-256 on
                                    # POST /dot/hook/github and map events to inbox tasks

    - id: dot-profile
      name: 'file:///path/to/opendot/plugins/dot-profile.entry.js'

    # v0.3: daily status pages (status/YYYY-MM-DD.md) — the archival layer
    # under the live /dot/status view. Pair with one durable schedule so the
    # goal loop writes yesterday's page each day:
    #   dot_schedule add-every --name daily-rollup --everySeconds 86400 \
    #     --task 'STATUS ROLLUP: run dot_report write (default yesterday); if the tool is unavailable, remount the preset'
    - id: dot-report
      name: 'file:///path/to/opendot/plugins/dot-report.entry.js'
